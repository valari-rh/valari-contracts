[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./config" }]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[fmt]
line_length = 100


# >>> fizz fuzz profile
[profile.fuzz]
via_ir = true
optimizer = false
optimizer_runs = 0
# <<< fizz fuzz profile
